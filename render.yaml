# Blueprint do Render: cria o backend (Spring Boot) no plano gratuito.
# O banco fica no Supabase (Postgres gratuito). Veja DEPLOY.md.
services:
  - type: web
    name: felipe-area-membros-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/site
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EDUZZ_WEBHOOK_TOKEN
        generateValue: true
      # O disco do Render grátis é apagado a cada reinício: imagens vão para o banco
      # e os vídeos entram por link do YouTube (não listado) ou Vimeo.
      - key: IMAGENS_NO_BANCO
        value: "true"
      - key: UPLOAD_VIDEO
        value: "false"
      - key: MAX_UPLOAD
        value: 20MB
