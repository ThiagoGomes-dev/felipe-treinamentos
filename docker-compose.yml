# Sobe o site completo com PostgreSQL: docker compose up --build
services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: area_membros
      POSTGRES_USER: area_membros
      POSTGRES_PASSWORD: troque-esta-senha
    volumes:
      - dados-banco:/var/lib/postgresql/data

  app:
    build: .
    depends_on: [banco]
    ports:
      - "8080:8080"
    volumes:
      - uploads:/dados/uploads   # imagens e vídeos enviados pelo painel
    environment:
      DATABASE_URL: jdbc:postgresql://banco:5432/area_membros
      DATABASE_USER: area_membros
      DATABASE_PASSWORD: troque-esta-senha
      APP_URL: http://localhost:8080
      JWT_SECRET: troque-por-um-segredo-longo-de-pelo-menos-32-caracteres
      ADMIN_EMAIL: admin@felipetrainer.com.br
      ADMIN_PASSWORD: troque-esta-senha-do-admin
      EDUZZ_WEBHOOK_TOKEN: troque-este-token
      DADOS_EXEMPLO: "true"
      UPLOADS_DIR: /dados/uploads
      MAX_UPLOAD: 2GB
      MAX_VIDEO_MB: "2048"
      # SMTP_HOST: smtp.seuprovedor.com
      # SMTP_USER: ...
      # SMTP_PASSWORD: ...

volumes:
  dados-banco:
  uploads:
